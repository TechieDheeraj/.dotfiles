# Prefer wifi over wired when both are up.
#
# NetworkManager's defaults are ethernet 100 / wifi 600, and lower wins, so a
# plugged-in dock silently takes over the default route. This flips that.
#
# A connection default rather than a per-profile setting: it applies to every
# wifi profile, including ones created after this file lands, and it keeps wifi
# passwords out of the dotfiles repo. Per-profile ipv4.route-metric still
# overrides it if you ever want one specific network to behave differently.
[connection-wifi-route-metric]
match-device=type:wifi
ipv4.route-metric=50
ipv6.route-metric=50
