# Hibernate by plain power-off instead of handing off to ACPI S4.
#
# WHAT THIS IS NOT: it does not shut the machine down instead of hibernating.
# Every hibernate mode ends with the laptop powered off -- that is what hibernate
# is. This only selects HOW power is cut once the memory image is already written
# to swap. The session is restored identically either way, via resume= and
# resume_offset= on the kernel command line.
#
#   platform  -> ask ACPI/firmware to enter S4; firmware keeps wake plumbing armed
#   shutdown  -> plain power-off, the same code path as `poweroff`
#
# WHY IT MUST BE SET HERE, NOT IN /sys/power/disk:
# systemd-hibernate.service WRITES /sys/power/disk itself, immediately before
# hibernating, from HibernateMode=. The default is "platform shutdown", tried in
# order until one write succeeds -- so "platform" always wins. Setting
# /sys/power/disk by hand (or via tmpfiles.d) is silently discarded by systemd
# the moment you run `systemctl hibernate`. Verified on this machine: the value
# read back as [shutdown], and the hibernate still logged
# "ACPI: PM: Preparing to enter system sleep state S4".
#
# WHY: measured S4 standby draw here was 2.82 W over an 8h19m hibernate
# (74% -> 47%, 23.5 Wh). Typical is 0.1-0.5 W. ACPI S4 was leaving rails
# energised -- most likely the WiFi card and its PCIe root port, which
# wifi-d3cold-guard deliberately pins out of D3cold on the way into sleep, and
# S4 depends on D3cold to let firmware cut those rails.
#
# COST: ACPI-S4-only wake sources (RTC alarm) stop working. Irrelevant here --
# nothing but the power button can wake this machine from hibernate anyway.
#
# Only "shutdown" is listed, with no "platform" fallback, so a failure is loud
# rather than silently reverting to the behaviour we are trying to avoid.
[Sleep]
HibernateMode=shutdown
