# Always-on server profile for this laptop.
#
# Omarchy already ships two drop-ins in this directory (10-ignore-power-button.conf
# and 20-inhibit-delay.conf) which are owned by the omarchy-settings package and
# WILL be overwritten by omarchy-update. This file is ours: the "50-" prefix sorts
# it after both, and it only sets keys they do not touch, so nothing conflicts.

[Login]

# The single most important line here. systemd's default is HandleLidSwitch=suspend,
# so closing the lid today would suspend the machine and kill every SSH session.
# We run in clamshell, lid shut, so this must be ignore.
HandleLidSwitch=ignore

# When unset, these two fall back to HandleLidSwitch. Setting them explicitly means
# the behaviour cannot change if the machine is docked or the AC state is misread.
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore

# The keyboard's sleep/hibernate keys. Fn-key misfires should not take the server down.
HandleSuspendKey=ignore
HandleHibernateKey=ignore
HandleSuspendKeyLongPress=ignore
HandleHibernateKeyLongPress=ignore

# systemd's default is already "ignore", but an always-on box should not depend on
# an upstream default staying put. This is what would suspend the machine after
# IdleActionSec of no session activity.
IdleAction=ignore

# HandlePowerKey is already set to ignore by Omarchy's 10-ignore-power-button.conf,
# so it is deliberately not repeated here.
