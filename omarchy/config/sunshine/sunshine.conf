# Sunshine host config. Streams this desktop to Moonlight on the Mac.
#
# The web UI at https://localhost:47990 REWRITES this file on Save, which is why
# install.sh copies it rather than symlinking it (same reason as shell.json).
# After changing anything in the UI, copy it back:
#   cp ~/.config/sunshine/sunshine.conf ~/.dotfiles/omarchy/config/sunshine/

# Arrow Lake Arc 130T/140T. Without this, every single connect wastes ~1s
# probing nvenc and vulkan and failing before it settles on VAAPI anyway.
encoder = vaapi

# Advertise HEVC and AV1 so the client can negotiate the better codec.
# 2 = advertise. AV1 needs an M3 or newer Mac to decode in hardware.
hevc_mode = 2
av1_mode = 2

# No host-side cap on the client's requested bitrate.
# NOTE: this can only ever LOWER what the client asks for -- there is no host
# setting that raises it. A blurry stream is almost always the Moonlight
# bitrate slider, not anything in this file. See README.
max_bitrate = 0

# Default is 20. On a clean 5GHz Wi-Fi 6 link (-39 dBm, 160MHz, ~2.1Gbit/s)
# that much forward error correction is wasted; the freed share carries picture.
fec_percentage = 10
