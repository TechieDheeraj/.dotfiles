# Omarchy 4 kitty config, with the portable preferences from your Omarchy 2.x
# ~/.dotfiles/files/config/kitty/kitty.conf merged in.
#
# That 2.x file was a macOS config: kitty_mod was cmd+shift, and it used
# macos_titlebar_color / macos_show_window_title_in. On Linux kitty_mod is
# ctrl+shift and there is no cmd key, so every cmd+ binding in it was inert
# here. The bindings below are those same intents translated to Linux.

# Omarchy theme (leave first; it is what makes theme switching work).
include ~/.local/state/omarchy/current/theme/kitty.conf

# ---------------------------------------------------------------------------
# Font
# ---------------------------------------------------------------------------
font_family JetBrainsMono Nerd Font
bold_italic_font auto

# Kept at Omarchy's 9.0, NOT your 2.x font_size 16.0. That 16 was sized for a
# different display; this panel is 3000x1876 at scale 2, where 9 renders the
# same physical size. Change it here if it reads small.
font_size        9.0

# From 2.x `disable_ligatures always`. Programming ligatures (-> => != ligating
# into glyphs) stay off at all times, not just under the cursor.
disable_ligatures always

# ---------------------------------------------------------------------------
# Window
# ---------------------------------------------------------------------------
# Your 2.x config set window_padding_width 0, and your ghostty config repeated
# the choice with the comment "maximize usable terminal cells". Omarchy's
# default is 14. Yours wins.
window_padding_width 0
window_margin_width 1
single_window_margin_width -1

hide_window_decorations yes
confirm_os_window_close 0

# Unlimited scrollback, from 2.x `scrollback_lines -1`.
scrollback_lines -1

# ---------------------------------------------------------------------------
# Splits
# ---------------------------------------------------------------------------
# From 2.x: you used the Splits layout with visible coloured borders so the
# focused pane is obvious.
enabled_layouts Splits, Stack
window_border_width 2pt
draw_minimal_borders no
active_border_color   #00ff00
inactive_border_color #ff00aa

# ---------------------------------------------------------------------------
# Keybindings
# ---------------------------------------------------------------------------
# Omarchy defaults, kept.
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
# Send Shift+Enter as CSI-u so TUIs can distinguish it from Enter.
map shift+enter send_text all \e[13;2u
# Kitty legacy encoding sends Alt+Shift+Enter the same as Alt+Enter; send CSI-u so tmux can match M-S-Enter.
map alt+shift+enter send_text all \e[13;4u

# THE ONE YOU ASKED ABOUT: shell word navigation on ; and '.
# 2.x had `map cmd+; send_text all \x1b\x62` (ESC b = readline backward-word) and
# `map cmd+' send_text all \x1b\x66` (ESC f = forward-word). Alt is the Linux
# stand-in for cmd. Without this, Alt+; would just send ESC-semicolon.
# Same muscle memory as SUPER + ; / ' for window focus in Hyprland.
map alt+semicolon send_text all \x1bb
map alt+apostrophe send_text all \x1bf

# Pane navigation, from 2.x kitty_mod+; / kitty_mod+' (cmd+shift there).
map ctrl+shift+semicolon previous_window
map ctrl+shift+apostrophe next_window
map ctrl+shift+w close_window

# Splits, from 2.x kitty_mod+d (hsplit) and cmd+d (vsplit).
map ctrl+shift+d launch --location=hsplit
map ctrl+alt+d   launch --location=vsplit

# Layout cycling, from 2.x kitty_mod+enter.
map ctrl+shift+enter next_layout

# Pane resizing, from 2.x kitty_mod+, . ] [ /
map ctrl+shift+comma        resize_window narrower
map ctrl+shift+period       resize_window wider
map ctrl+shift+bracketright resize_window taller
map ctrl+shift+bracketleft  resize_window shorter
map ctrl+shift+slash        resize_window reset

# NOT ported: `map cmd+1..0 goto_tab N`. There is no cmd key, and ctrl+N is
# needed by the shell. Kitty's own ctrl+shift+1..9 already does goto_tab.

# ---------------------------------------------------------------------------
# Omarchy integration and aesthetics
# ---------------------------------------------------------------------------
allow_remote_control yes
listen_on unix:${XDG_RUNTIME_DIR}/omarchy-kitty-{kitty_pid}

cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor
enable_audio_bell no

tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}
