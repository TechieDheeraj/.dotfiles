# kitty, ported from ~/.dotfiles/files/config/kitty/kitty_hp_zbook.conf
#
# That file -- not kitty.conf, which was the macOS one -- is the config you
# actually ran on Linux, so it is the right source. Its scheme deliberately
# mirrors your Hyprland bindings one level down:
#
#     ; ' [ /   focus  ->  SUPER+; ' [ /   move window focus (bindings.lua)
#                          kitty_mod+      move between kitty panes
#     h l       word nav ->  SUPER+H/L     swap window
#                            kitty_mod+    shell backward/forward-word
#
# The ZBook file contains duplicate keys; kitty takes the LAST definition, so
# the effective bindings are written out here (e.g. ; is neighboring_window,
# not previous_window; [ and / are navigation, not resize).

# Omarchy theme. NOTE the path: Omarchy 2.x used ~/.config/omarchy/current/...,
# Omarchy 4 moved it to ~/.local/state/. Copying the old line verbatim would
# silently break theme switching.
include ~/.local/state/omarchy/current/theme/kitty.conf

# ---------------------------------------------------------------------------
# Modifier
# ---------------------------------------------------------------------------
# DEVIATION: the ZBook file says `kitty_mod cmd+shift`. There is no cmd key on
# Linux -- kitty maps cmd to Super, and Super is Hyprland's modifier, so every
# kitty_mod binding would be swallowed by the compositor before kitty saw it.
# ctrl+shift is the Linux equivalent and collides with nothing in bindings.lua.
kitty_mod ctrl+shift

# ---------------------------------------------------------------------------
# Font
# ---------------------------------------------------------------------------
font_family      JetBrainsMono Nerd Font
bold_italic_font auto
# 10.0 is what the ZBook file ends on (a later line overrides its earlier 9.0).
# Your panel is 3000x1876 at scale 2, so adjust by eye if this reads large.
font_size        10.0
disable_ligatures always

# ---------------------------------------------------------------------------
# Window
# ---------------------------------------------------------------------------
window_padding_width 0
window_margin_width 1
single_window_margin_width -1
hide_window_decorations no
confirm_os_window_close 0
scrollback_lines -1
remember_window_size  no
initial_window_width  1080
initial_window_height 960
shell /bin/bash

# ---------------------------------------------------------------------------
# Splits
# ---------------------------------------------------------------------------
enabled_layouts Splits, Stack
window_border_width 2pt
draw_minimal_borders no
active_border_color   #00ff00
inactive_border_color #ff00aa

map kitty_mod+d launch --location=hsplit
# DEVIATION: the ZBook file uses `cmd+d` here, which is Super+D on Linux and
# belongs to Hyprland. ctrl+alt+d is free in both.
map ctrl+alt+d  launch --location=vsplit
map kitty_mod+enter next_layout

# ---------------------------------------------------------------------------
# Pane navigation -- same four keys as SUPER+; ' [ / in Hyprland
# ---------------------------------------------------------------------------
map kitty_mod+semicolon  neighboring_window left
map kitty_mod+apostrophe neighboring_window right
map kitty_mod+bracketleft neighboring_window up
map kitty_mod+slash      neighboring_window down
map kitty_mod+w close_window

# ---------------------------------------------------------------------------
# Shell word navigation -- same h/l as SUPER+H/L in Hyprland
# ---------------------------------------------------------------------------
map kitty_mod+h send_text all \x1b\x62
map kitty_mod+l send_text all \x1b\x66

# ---------------------------------------------------------------------------
# Pane resize
# ---------------------------------------------------------------------------
map kitty_mod+comma        resize_window narrower
map kitty_mod+period       resize_window wider
map kitty_mod+bracketright resize_window taller
map kitty_mod+minus        resize_window shorter
map kitty_mod+equal        resize_window reset

# ---------------------------------------------------------------------------
# Tabs
# ---------------------------------------------------------------------------
map kitty_mod+t new_tab
map kitty_mod+q close_tab
map kitty_mod+n next_tab
map kitty_mod+p previous_tab
map kitty_mod+i set_tab_title
# DEVIATION: the ZBook file uses cmd+1..0 for goto_tab. On Linux that is
# SUPER+1..0, which Hyprland owns for workspace switching.
map kitty_mod+1 goto_tab 1
map kitty_mod+2 goto_tab 2
map kitty_mod+3 goto_tab 3
map kitty_mod+4 goto_tab 4
map kitty_mod+5 goto_tab 5
map kitty_mod+6 goto_tab 6
map kitty_mod+7 goto_tab 7
map kitty_mod+8 goto_tab 8
map kitty_mod+9 goto_tab 9
map kitty_mod+0 goto_tab 10

map ctrl+alt+comma load_config_file

# ---------------------------------------------------------------------------
# Omarchy integration + clipboard (kept from Omarchy's template)
# ---------------------------------------------------------------------------
allow_remote_control yes
listen_on unix:${XDG_RUNTIME_DIR}/omarchy-kitty-{kitty_pid}
map ctrl+insert  copy_to_clipboard
map shift+insert paste_from_clipboard
map shift+enter     send_text all \e[13;2u
map alt+shift+enter send_text all \e[13;4u
cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor
enable_audio_bell no

# NOT ported: macos_titlebar_color / macos_show_window_title_in (no-ops on Linux).
